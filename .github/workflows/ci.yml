name: CI

on:
  push:
    branches: [main, staging, 'release/**']
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time env stays optional; runtime /api/public-config is the source of truth.
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || '' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || '' }}
  VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '' }}
  VITE_APP_NAME: SBBL HQ
  VITE_DEFAULT_LEAGUE: SBBL

jobs:
  # ── Job 1: Lint + Typecheck ────────────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          echo "::group::npm ci"
          npm ci
          echo "::endgroup::"

      - name: Contract Gates
        run: |
          echo "::group::Config Integrity"
          npm run config:contracts
          echo "::endgroup::"

          echo "::group::Secrets Placeholder Validation"
          npm run secrets:contracts
          echo "::endgroup::"

          echo "::group::Docs Drift Validation"
          npm run docs:drift
          echo "::endgroup::"

          echo "::group::ESLint (zero-warning policy)"
          npm run lint
          echo "::endgroup::"

          echo "::group::Typecheck (tsc --noEmit)"
          npm run typecheck
          echo "::endgroup::"

      # ── Job 2: Unit & Integration Tests + Coverage ────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit/integration tests (no coverage, shard 1/2)
        run: npm run test:ci:shard1
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: true

      - name: Run unit/integration tests (no coverage, shard 2/2)
        run: npm run test:ci:shard2
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: true

      - name: Run critical-surface coverage
        run: npm run test:coverage:critical
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── Job 3: Build + Bundle Regression Guard ────────────────────────────────
  build:
    name: Build & Bundle Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 15
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Bundle regression guard
        shell: bash
        run: |
          set -e
          DIST=dist/assets

          check_chunk() {
            local pattern="$1"
            local limit_kb="$2"
            local chunk_name="$3"
            local file
            file=$(ls "$DIST"/${pattern}-*.js 2>/dev/null | head -1 || true)
            if [ -z "$file" ]; then
              echo "⚠️  $chunk_name chunk not found — may be tree-shaken away (OK)"
              return 0
            fi
            local size_kb
            size_kb=$(( $(wc -c < "$file") / 1024 ))
            if [ "$size_kb" -gt "$limit_kb" ]; then
              echo "❌  $chunk_name: ${size_kb} KB > ${limit_kb} KB limit (file: $file)"
              exit 1
            fi
            echo "✅  $chunk_name: ${size_kb} KB / ${limit_kb} KB"
          }

          check_chunk "react-vendor"    185  "react-vendor"
          check_chunk "supabase-vendor" 215  "supabase-vendor"
          check_chunk "ui-vendor"       700  "ui-vendor"
          check_chunk "charts-vendor"   280  "charts-vendor"
          check_chunk "rxdb-vendor"     600  "rxdb-vendor"
          check_chunk "media-vendor"    360  "media-vendor"
          check_chunk "query-vendor"    80   "query-vendor"
          check_chunk "utils-vendor"    140  "utils-vendor"
          check_chunk "forms-vendor"    80   "forms-vendor"

          total_kb=$(du -sk "$DIST" | cut -f1)
          echo "📦  Total assets: ${total_kb} KB"
          if [ "$total_kb" -gt 8192 ]; then
            echo "⚠️  Total assets exceed 8 MB — review bundle composition"
          fi

      - name: Verify build artifact excludes source maps
        run: |
          if find dist -name '*.map' -print -quit | grep -q .; then
            echo '❌ dist contains source maps'
            find dist -name '*.map' -print
            exit 1
          fi
          echo '✅ dist contains no source maps'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ── Job 4: Lighthouse LCP Budget ─────────────────────────────────────────
  lighthouse:
    name: Lighthouse LCP Budget
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    timeout-minutes: 15
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14

      - name: Serve build and run Lighthouse
        run: |
          npx vite preview --port 4173 &
          SERVER_PID=$!
          timeout 30 bash -c 'until curl -sf http://localhost:4173/; do sleep 1; done'
          lhci autorun \
            --collect.url=http://localhost:4173/ \
            --collect.numberOfRuns=1 \
            --assert.assertions.largest-contentful-paint="[\"error\",{\"maxNumericValue\":1800}]" \
            --assert.assertions.cumulative-layout-shift="[\"warn\",{\"maxNumericValue\":0.1}]" \
            --assert.assertions.first-contentful-paint="[\"warn\",{\"maxNumericValue\":2500}]" \
            --assert.assertions.total-blocking-time="[\"warn\",{\"maxNumericValue\":300}]" \
            --upload.target=temporary-public-storage
          kill $SERVER_PID || true
        continue-on-error: true

  # ── Job 5: Playwright E2E ─────────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || '' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
      VITE_DEFAULT_LEAGUE: SBBL
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Job 6: Broadcast Evidence Capture ──────────────────────────────────────
  broadcast-evidence:
    name: Broadcast Evidence Capture
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || '' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'test-anon-key' }}
      VITE_DEFAULT_LEAGUE: SBBL
    timeout-minutes: 25
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run Broadcast Evidence Tests
        run: npx playwright test tests/e2e/broadcast-paywall-evidence.spec.ts --project=chromium --trace=on --reporter=list,html
        env:
          CI: true

      - name: Verify Broadcast Evidence Artifacts
        run: |
          test -s artifacts/broadcast-evidence/manifest.json
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('artifacts/broadcast-evidence/manifest.json','utf8')); if (m.passFail !== 'PASS') { console.error(m); process.exit(1); } if (!m.screenshots?.length || !m.networkLogs?.length) { console.error('missing evidence artifacts', m); process.exit(1); }"
          find artifacts/broadcast-evidence/screenshots -type f -name '*.png' -print -quit | grep -q .
          find artifacts/broadcast-evidence/network-logs -type f -name '*.json' -print -quit | grep -q .
          find test-results -type f -name '*.zip' -print -quit | grep -q .
          test -d playwright-report

      - name: Upload Broadcast Evidence Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-evidence-playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Broadcast Evidence Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-evidence-screenshots
          path: artifacts/broadcast-evidence/screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Broadcast Evidence Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-evidence-traces
          path: test-results/**/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Broadcast Evidence Network Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-evidence-network-logs
          path: |
            artifacts/broadcast-evidence/manifest.json
            artifacts/broadcast-evidence/network-logs/
          if-no-files-found: error
          retention-days: 14
